<text x="70" y="1080" class="h2">4 · Why the level-14 phase build is fragile in the intended MT-32 configuration</text>
<text x="70" y="1110" class="label num">Stock level-14 far live + surface  121.0 KiB   +   phase banks  275.7 KiB   +   KID delta  3.9 KiB   =   400.6 KiB</text>
<rect x="70.00" y="1130" width="328.95" height="34" fill="#2f8fff"/>
<rect x="398.95" y="1130" width="749.59" height="34" fill="#c77dff"/>
<rect x="1148.54" y="1130" width="10.65" height="34" fill="#ff9f43"/>
<rect x="1159.19" y="1130" width="40.81" height="34" fill="#293746"/>
<text x="1220" y="1154" class="label num">15.0 KiB aggregate free-block extent</text>
<text x="70" y="1195" class="small">At reunion, PV/951 immediately needs two separate 32,006-byte blocks. Freed phase bytes are split among arena-local holes; the CRT never returns arenas to DOS.</text>
<text x="1530" y="1195" text-anchor="end" class="small">Exact / measured / derived values are distinguished in REPORT.md</text>
