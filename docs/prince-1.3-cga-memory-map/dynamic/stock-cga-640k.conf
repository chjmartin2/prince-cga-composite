[sdl]
fullscreen=false
fulldouble=false
output=surface
autolock=false
waitonerror=true
priority=normal,normal
mapperfile=mapper-stock-cga.map
usescancodes=false

[dosbox]
language=
machine=cga
captures=capture
memsize=16

[render]
frameskip=0
aspect=false
scaler=none

[cpu]
core=normal
cputype=auto
cycles=fixed 3000
cycleup=500
cycledown=500

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[midi]
mpu401=intelligent
mididevice=default
midiconfig=

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[speaker]
pcspeaker=true
pcrate=44100
tandy=off
tandyrate=44100
disney=false

[joystick]
joysticktype=none
timed=true
autofire=false
swap34=false
buttonwrap=false

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=false
ems=false
umb=false
keyboardlayout=none

[ipx]
ipx=false

[autoexec]
# Commands are supplied explicitly on the DOSBox command line.
